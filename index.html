<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تفضلين 💗</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&display=swap" rel="stylesheet">

<body>
<div class="blobs"><span></span><span></span><span></span></div>

        <stop offset="0" stop-color="#ff8fbd"/><stop offset=".5" stop-color="#ff3d8b"/><stop offset="1" stop-color="#c2185b"/>

    <g id="hg"></g>

  <div class="names"><div class="nm">قمر <b>♥</b> محمود</div><div class="dt">2026 / 10 / 23</div></div>

</html>
